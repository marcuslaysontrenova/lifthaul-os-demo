name: LiftHaul canonical production read-only smoke

on:
  push:
    branches:
      - codex/railway-mvp-smoke-20261013
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Approved 40-character SHA already deployed to canonical Railway'
        required: true
        type: string
      run_authenticated:
        description: 'Run authorized QA login after protected test-account secrets are configured'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline-auth-qa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify no-write and fail-closed production QA harness without credentials
        run: python -m unittest discover -s scripts/go_live -p 'test_prod_auth_qa_contract.py' -v

  canonical-production-smoke:
    # Never block Railway's check-suite-gated deployment by waiting for that
    # very same deployment from a commit-triggered CI check.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/railway-mvp-smoke-20261013') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact live release, location manifest and public access controls
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '695478d48513ecd4bbb5efe5f61d3f2994174311' }}
          CANONICAL_URL: https://www.lifthaul.com.ph
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["CANONICAL_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"]
          evidence = {"expected_sha": expected, "canonical_url": base, "checks": {}}
          def fetch(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "LiftHaul-Canonical-Release-Smoke/1.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      return response.status, response.read(16 * 1024 * 1024), response.headers.get("Content-Type", "")
              except urllib.error.HTTPError as error:
                  return error.code, error.read(2048), error.headers.get("Content-Type", "")

          try:
              ready = None
              for attempt in range(48):
                  try:
                      code, raw, _ = fetch("/readyz")
                      data = json.loads(raw) if code == 200 else {}
                      observed = data.get("release_sha")
                      if code == 200 and observed == expected and data.get("status") == "ready" and data.get("schema_version") is not None:
                          ready = data
                          break
                      print(f"Readiness attempt {attempt + 1}/48: HTTP {code}; SHA {observed}")
                  except Exception as exc:
                      print(f"Readiness attempt {attempt + 1}/48: {type(exc).__name__}")
                  time.sleep(15)
              assert ready is not None, "Canonical backend did not report the approved release SHA as ready"
              evidence["checks"]["readiness"] = {"status": "PASS", "release_sha": ready["release_sha"], "schema_version": ready["schema_version"]}

              code, raw, _ = fetch("/healthz")
              health = json.loads(raw) if code == 200 else {}
              assert code == 200 and health.get("status") == "ok", f"Health endpoint HTTP {code}"
              evidence["checks"]["health"] = {"status": "PASS", "http_code": code}

              code, raw, mime = fetch("/data/psgc/manifest.json")
              assert code == 200, f"PSGC manifest HTTP {code}"
              manifest = json.loads(raw)
              assert isinstance(manifest, (dict, list)) and bool(manifest), "PSGC manifest is empty or invalid"
              evidence["checks"]["geography_manifest"] = {"status": "PASS", "http_code": code, "json_type": type(manifest).__name__}

              groups = manifest.get("island_groups", []) if isinstance(manifest, dict) else []
              assert len(groups) >= 3, f"PSGC manifest missing island groups: {len(groups)}"
              for group in groups:
                  source_file = group.get("file", "")
                  assert source_file.startswith("data/psgc/") and source_file.endswith(".json"), "Ungoverned PSGC source path"
                  file_code, file_raw, _ = fetch("/" + source_file)
                  assert file_code == 200, f"PSGC {source_file} returned HTTP {file_code}"
                  payload = json.loads(file_raw)
                  assert payload, f"PSGC {source_file} has no data"
                  evidence["checks"][source_file] = {"status": "PASS", "http_code": file_code}

              for path in ("/", "/book.html", "/client.html", "/driver-register.html", "/founder.html"):
                  code, raw, mime = fetch(path)
                  assert code == 200, f"{path} HTTP {code}"
                  assert b"<html" in raw.lower() or b"<!doctype" in raw.lower(), f"{path} did not return HTML"
                  evidence["checks"][path] = {"status": "PASS", "http_code": code}

              code, raw, _ = fetch("/admin/marketplace/public-booking-queue")
              assert code in (401, 403), f"Unauthenticated admin endpoint returned HTTP {code} (expected 401/403)"
              evidence["checks"]["admin_access_denial"] = {"status": "PASS", "http_code": code}

              code, raw, _ = fetch("/public/payments/channels")
              assert code == 200, f"Payment-channel information returned HTTP {code}"
              evidence["checks"]["payment_catalogue_read_only"] = {"status": "PASS", "http_code": code}
              print("ALL READ-ONLY PRODUCTION SMOKE GATES PASSED")
          finally:
              with open("evidence/canonical-smoke.json", "w", encoding="utf-8") as file:
                  json.dump(evidence, file, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifthaul-canonical-smoke
          path: evidence/canonical-smoke.json
          retention-days: 30

  # Intentional single synthetic production booking only after release identity is verified.
  # This never initiates checkout, payment capture, transfers or provider payouts.
  authenticated-qa-readonly:
    needs: canonical-production-smoke
    # A read-only smoke PASS must never be presented as authenticated UAT PASS.
    # Explicit opt-in is required after credential provisioning.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_authenticated == true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify scoped test credentials without exposing values
        env:
          LH_ADMIN_EMAIL: ${{ secrets.LH_PROD_TEST_ADMIN_EMAIL }}
          LH_ADMIN_PASSWORD: ${{ secrets.LH_PROD_TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$LH_ADMIN_EMAIL" ] || [ -z "$LH_ADMIN_PASSWORD" ]; then
            echo "::error::Authenticated production UAT blocked: configure the scoped test-account secrets."
            exit 1
          fi
      - name: Read-only authenticated QA acceptance of existing synthetic booking
        env:
          BASE_URL: https://www.lifthaul.com.ph
          EXPECTED_SHA: ${{ inputs.expected_sha || '695478d48513ecd4bbb5efe5f61d3f2994174311' }}
          LH_TEST_BOOKING_REF: LH-XDMVQO
          LH_ADMIN_EMAIL: ${{ secrets.LH_PROD_TEST_ADMIN_EMAIL }}
          LH_ADMIN_PASSWORD: ${{ secrets.LH_PROD_TEST_ADMIN_PASSWORD }}
        run: python scripts/go_live/prod_auth_qa.py
