name: LiftHaul Production Health Monitor

on:
  workflow_dispatch:
    inputs:
      alert_drill:
        description: Exercise incident routing after healthy production probes (no production mutation)
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ownership
        name: Validate monitored production ownership
        continue-on-error: true
        env:
          OPERATIONS_OWNER: ${{ vars.LH_PROD_OPERATIONS_OWNER || github.repository_owner }}
          INCIDENT_OWNER: ${{ vars.LH_PROD_INCIDENT_OWNER || github.repository_owner }}
          FALLBACK_OWNER: ${{ github.repository_owner }}
          OPS_CONFIGURED: ${{ vars.LH_PROD_OPERATIONS_OWNER != '' }}
          INCIDENT_CONFIGURED: ${{ vars.LH_PROD_INCIDENT_OWNER != '' }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          [ -n "$OPERATIONS_OWNER" ] || { echo "::error::Set production variable LH_PROD_OPERATIONS_OWNER"; exit 1; }
          [ -n "$INCIDENT_OWNER" ] || { echo "::error::Set production variable LH_PROD_INCIDENT_OWNER"; exit 1; }
          python - <<'PY'
          import json, os
          with open('evidence/ownership.json', 'w', encoding='utf-8') as handle:
              json.dump({
                  'operations_owner': os.environ['OPERATIONS_OWNER'],
                  'incident_owner': os.environ['INCIDENT_OWNER'],
                  'configured': os.environ['OPS_CONFIGURED'] == 'true' and os.environ['INCIDENT_CONFIGURED'] == 'true',
                  'operations_source': 'explicit' if os.environ['OPS_CONFIGURED'] == 'true' else 'repository_owner_fallback',
                  'incident_source': 'explicit' if os.environ['INCIDENT_CONFIGURED'] == 'true' else 'repository_owner_fallback',
                  'fallback_owner': os.environ['FALLBACK_OWNER'],
                  'requires_human_alert_acknowledgment': True,
              }, handle, indent=2)
          PY
          # A repository-owner fallback preserves alert routing, but it is not
          # proof that dedicated operations and incident coverage is staffed.
          if [ "$OPS_CONFIGURED" != "true" ] || [ "$INCIDENT_CONFIGURED" != "true" ]; then
            echo "::error::Named production operations and incident owners are required for Gate 6"
            exit 1
          fi
      - id: surface
        name: Canonical production surface, readiness, and release identity
        if: always()
        continue-on-error: true
        env:
          PRODUCTION_URL: https://www.lifthaul.com.ph
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/" -o evidence/frontend.html
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/healthz" -o evidence/health.json
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/readyz" -o evidence/ready.json
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/data/psgc/manifest.json" -o evidence/psgc-manifest.json
          python - <<'PY'
          import json
          health=json.load(open('evidence/health.json', encoding='utf-8'))
          ready=json.load(open('evidence/ready.json', encoding='utf-8'))
          psgc=json.load(open('evidence/psgc-manifest.json', encoding='utf-8'))
          frontend=open('evidence/frontend.html', encoding='utf-8').read().lower()
          assert health.get('status') == 'ok', health
          assert ready.get('status') == 'ready', ready
          assert ready.get('schema_version') is not None, ready
          assert ready.get('release_sha') not in (None, '', 'unknown'), ready
          assert psgc, 'PSGC manifest is empty'
          for prohibited in ('demo prototype', 'lifthaul (demo)', 'prototype · in-browser'):
              assert prohibited not in frontend, prohibited
          PY
          deployed_sha=$(python -c "import json; print(json.load(open('evidence/ready.json'))['release_sha'])")
          git merge-base --is-ancestor "$deployed_sha" origin/main
      - name: Enforce independent, fail-closed monitoring verdict
        if: always()
        env:
          OWNERSHIP_OUTCOME: ${{ steps.ownership.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
          MONITOR_EVIDENCE_PATH: evidence/monitor-gate.json
        run: python scripts/go_live/monitor_gate.py
      - id: alert_drill
        name: Controlled alert-delivery drill
        if: ${{ inputs.alert_drill == true }}
        run: |
          set -euo pipefail
          cat > evidence/alert-drill.json <<'JSON'
          {
            "requested": true,
            "production_mutated": false,
            "live_funds_changed": false,
            "result": "EXPECTED_MONITOR_FAILURE"
          }
          JSON
          echo "::error::Controlled alert-delivery drill requested after healthy production probes"
          exit 1
      - name: Open or update the production-health incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_OWNER: ${{ vars.LH_PROD_INCIDENT_OWNER || github.repository_owner }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_DRILL: ${{ steps.alert_drill.outcome == 'failure' }}
        run: |
          set -euo pipefail
          if [ "$ALERT_DRILL" = "true" ]; then
            title='[DRILL] Production health alert delivery test'
            body="Controlled alert-delivery drill reached incident routing at ${RUN_URL}. Production probes passed first; production and live-funds controls were not changed. The incident owner must acknowledge this drill before Gate 6 closeout."
          else
            title='Production health monitor is failing'
            body="Production monitoring failed at ${RUN_URL}. The incident owner must acknowledge, diagnose, and record recovery evidence. No live-funds control should be changed as part of this response."
          fi
          number=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          elif [ -n "$INCIDENT_OWNER" ]; then
            gh issue create --title "$title" --body "$body" --assignee "$INCIDENT_OWNER"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-health-${{ github.run_id }}
          retention-days: 14
          path: evidence/**

