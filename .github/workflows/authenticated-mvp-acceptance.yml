name: LiftHaul authenticated MVP acceptance (isolated evidence)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/authenticated-mvp-acceptance.yml'
      - 'scripts/go_live/isolated_acceptance_evidence.py'
      - 'scripts/go_live/test_isolated_acceptance_evidence.py'

permissions:
  contents: read

jobs:
  client-identity-and-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Booker login recovery, isolation and client dashboard
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m unittest -v test_client_auth test_client_portal

  carrier-and-driver-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fleet owner, driver, and cross-carrier denial
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m unittest -v test_carrier_portal test_driver_app

  staff-finance-founder-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Staff segregation, tenant isolation, founder-only MFA
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m unittest -v test_booking_access_model test_tenant_isolation test_founder_dashboard

  booking-tracking-and-live-funds-off:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic public booking, tracking, approvals and funds fail-closed
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m unittest -v test_public_booking test_public_intake_qa_lifecycle test_protected_payment_e2e

  qa-permission-and-email-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: QA permissions, read-only account and fail-closed email delivery
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m unittest -v test_public_intake_qa_lifecycle test_auth_email
      - name: Offline production QA contract forbids privileged actions
        run: python -m unittest discover -s scripts/go_live -p 'test_prod_auth_qa_contract.py' -v

  acceptance-summary:
    if: always()
    needs:
      - client-identity-and-workspace
      - carrier-and-driver-access
      - staff-finance-founder-authority
      - booking-tracking-and-live-funds-off
      - qa-permission-and-email-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persist exact SHA, CI-only role evidence and explicit missing hosted gates
        env:
          LH_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          LH_TESTED_CHECKOUT_SHA: ${{ github.sha }}
          LH_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          LH_EVENT_NAME: ${{ github.event_name }}
          LH_SUITE_CLIENT_IDENTITY_AND_WORKSPACE: ${{ needs.client-identity-and-workspace.result }}
          LH_SUITE_CARRIER_AND_DRIVER_ACCESS: ${{ needs.carrier-and-driver-access.result }}
          LH_SUITE_STAFF_FINANCE_FOUNDER_AUTHORITY: ${{ needs.staff-finance-founder-authority.result }}
          LH_SUITE_BOOKING_TRACKING_AND_LIVE_FUNDS_OFF: ${{ needs.booking-tracking-and-live-funds-off.result }}
          LH_SUITE_QA_PERMISSION_AND_EMAIL_CONTRACT: ${{ needs.qa-permission-and-email-contract.result }}
          LH_ISOLATED_EVIDENCE_PATH: evidence/isolated-mvp-acceptance.json
        run: python scripts/go_live/isolated_acceptance_evidence.py
      - name: Preserve sanitized evidence, including failures; never secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-mvp-role-acceptance-${{ github.run_id }}
          path: evidence/isolated-mvp-acceptance.json
          retention-days: 21
          if-no-files-found: warn
