name: LiftHaul Gate 5 production persona UAT

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit currently reported by production /readyz
        required: true
        type: string

permissions:
  contents: read

# This workflow deliberately provisions its synthetic test fixtures only through
# governed production APIs. It must never mutate Railway variables or redeploy
# production as part of acceptance testing.

concurrency:
  group: lifthaul-production-persona-uat
  cancel-in-progress: false

jobs:
  exact-production-personas:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject non-exact or unmerged commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "${#RELEASE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Verify protected synthetic provisioning seed
        env:
          PROVISION_SEED: ${{ secrets.LH_PROD_PERSONA_PROVISION_SEED }}
          PROVISION_ADMIN_EMAIL: ${{ secrets.LH_PROD_PERSONA_ADMIN_EMAIL }}
          PROVISION_ADMIN_PASSWORD: ${{ secrets.LH_PROD_PERSONA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PROVISION_SEED"
          test -n "$PROVISION_ADMIN_EMAIL"
          test -n "$PROVISION_ADMIN_PASSWORD"
      - name: Derive private synthetic credentials
        env:
          LH_PROD_PERSONA_PROVISION_SEED: ${{ secrets.LH_PROD_PERSONA_PROVISION_SEED }}
        run: |
          set -euo pipefail
          python scripts/go_live/prod_persona_credentials.py \
            --manifest-out "$RUNNER_TEMP/gate5-personas.json"
      - name: Materialize protected provisioning identity
        env:
          PROVISION_ADMIN_EMAIL: ${{ secrets.LH_PROD_PERSONA_ADMIN_EMAIL }}
          PROVISION_ADMIN_PASSWORD: ${{ secrets.LH_PROD_PERSONA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PROVISION_ADMIN_EMAIL" > "$RUNNER_TEMP/gate5-admin-email"
          printf '%s' "$PROVISION_ADMIN_PASSWORD" > "$RUNNER_TEMP/gate5-admin-password"
      - name: Wait for the exact release to become ready
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            actual=$(curl -fsS https://www.lifthaul.com.ph/readyz | \
              python -c 'import json,sys; print(json.load(sys.stdin).get("release_sha", ""))' || true)
            [ "$actual" = "$EXPECTED_SHA" ] && exit 0
            sleep 10
          done
          echo "production never reported the exact Gate 5 release" >&2
          exit 1
      - name: Provision governed synthetic personas and fixtures
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python scripts/go_live/prod_persona_provision.py \
            --manifest "$RUNNER_TEMP/gate5-personas.json" \
            --admin-email "$RUNNER_TEMP/gate5-admin-email" \
            --admin-password "$RUNNER_TEMP/gate5-admin-password" \
            --output evidence/production-persona-provision.json
      - name: Run exact-release hosted persona evidence
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
          OUTPUT_PATH: evidence/production-persona-uat.json
        run: |
          set -euo pipefail
          export LH_PROD_PERSONA_CREDENTIALS_JSON="$(cat "$RUNNER_TEMP/gate5-personas.json")"
          python scripts/go_live/prod_persona_uat.py
          unset LH_PROD_PERSONA_CREDENTIALS_JSON
      - name: Remove private runner files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gate5-personas.json" \
            "$RUNNER_TEMP/gate5-admin-email" "$RUNNER_TEMP/gate5-admin-password"
      - name: Upload redacted Gate 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-persona-uat-${{ inputs.release_sha }}
          path: |
            evidence/production-persona-provision.json
            evidence/production-persona-uat.json
          if-no-files-found: error
          retention-days: 90
