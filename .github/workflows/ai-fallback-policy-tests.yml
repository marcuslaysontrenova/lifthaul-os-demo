name: AI fallback policy tests (offline)
on:
  pull_request:
    paths:
      - 'scripts/ai/**'
      - '.github/workflows/ai-fallback-policy-tests.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline no-credential fallback simulation
        run: python -m unittest discover -s scripts/ai -p 'test_*.py' -v
      - name: Persistent synthetic handover artifact (no provider calls)
        run: |
          python scripts/ai/handover_runner.py --handover docs/ai/fixtures/issue20-handover-synthetic.json --output evidence/ai/issue20-handover-decision.json
      - name: Preserve sanitized offline handover evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-handover-offline-${{ github.sha }}
          path: evidence/ai/issue20-handover-decision.json
          retention-days: 30
          if-no-files-found: error
