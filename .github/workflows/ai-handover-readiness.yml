name: AI agent handover readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/ai/**'
      - '.github/workflows/ai-handover-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    name: Validate non-production handover contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check handover document and safety rails
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/ai/AGENT_HANDOVER.md
          grep -Fq 'Codex primary' docs/ai/AGENT_HANDOVER.md
          grep -Fq 'Claude Code fallback' docs/ai/AGENT_HANDOVER.md
          grep -Fq 'Gemini CLI fallback' docs/ai/AGENT_HANDOVER.md
          grep -Fq 'must not merge' docs/ai/AGENT_HANDOVER.md
          echo 'Documentation readiness checks passed; no AI agent has been launched.'
