name: Go-Live — PostgreSQL runtime + production E2E

# Executes the launch-critical runtime gates against a REAL PostgreSQL 16 service container:
#   Gate 1  — schema migrated on PostgreSQL (migrate.py)
#   Gate 2  — app boots in APP_ENV=production against PostgreSQL; /healthz + /readyz green
#   Gate 3  — production E2E smoke (one synthetic transaction over HTTP)
#   Gate 2b — restart persistence: data survives a server restart on PostgreSQL
#   Gate 5  — backup/restore reconciliation drill
# This is the automated stand-in for a hosted PostgreSQL deploy — it runs on every push.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-sqlite:
    name: Full regression (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - name: pytest (full suite)
        working-directory: backend
        run: python -m pytest -q

  postgres-runtime:
    name: PostgreSQL runtime + production E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifthaul
          POSTGRES_PASSWORD: lifthaul_ci
          POSTGRES_DB: lifthaul
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U lifthaul -d lifthaul"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lifthaul:lifthaul_ci@localhost:5432/lifthaul
      APP_ENV: production
      APP_SECRET: CI-LiftHaul-Application-Secret-2026-000000000
      CORS_ORIGINS: http://localhost:3000
      PORT: "8787"
      LIFTHAUL_CI: "true"
      LH_ADMIN_EMAIL: admin@ci.lifthaul.invalid
      LH_ADMIN_PASSWORD: CI-LiftHaul-Admin-2026-Strong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary

      - name: Gate 1 — migrate schema on PostgreSQL
        working-directory: backend
        run: python migrate.py

      - name: Gate 2 — boot app (production, PostgreSQL) + probes
        working-directory: backend
        run: |
          python server.py & echo $! > /tmp/srv.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/readyz > /tmp/ready.json; then break; fi; sleep 1;
          done
          echo "readyz: $(cat /tmp/ready.json)"
          curl -sf http://localhost:8787/healthz | grep -q '"ok"'
          grep -q '"ready"' /tmp/ready.json

      - name: Gate 3 — production E2E smoke (over HTTP, on PostgreSQL)
        run: BASE_URL=http://localhost:8787 python scripts/go_live/prod_e2e.py

      - name: Preflight — launch posture (fail-closed flags OFF)
        run: BASE_URL=http://localhost:8787 python scripts/go_live/preflight.py

      - name: Gates 3b/4 — full acceptance lifecycle + two-tenant isolation (on PostgreSQL)
        run: python scripts/go_live/pg_lifecycle.py
        # Onboarding -> booking -> pricing -> matching -> assignment -> Protected Payment (MOCK) ->
        # SETTLED -> carrier settlement -> recipient OTP, then Tenant B denied on every Tenant A resource.

      - name: Provider Activation lifecycle — public signup -> OTP -> workspace (production posture, on PostgreSQL)
        env:
          APP_ENV: production        # OTP code is NEVER surfaced/logged; harness uses the in-process capture seam
          OTP_TEST_CAPTURE: "1"
        run: python scripts/go_live/provider_activation_e2e.py
        # Public registration -> PENDING login -> OTP verify -> ACTIVE -> /login -> own carrier workspace
        # -> add vehicle/driver/service area -> submit compliance -> provider CANNOT self-verify ->
        # independent reviewer verifies -> marketplace eligibility; then cross-provider isolation.

      - name: Gate 2b — restart persistence (data survives a restart on PostgreSQL)
        working-directory: backend
        run: |
          # count public bookings, restart the server, confirm they persist
          TOK=$(curl -s -X POST http://localhost:8787/login -H 'Content-Type: application/json' \
                -d "{\"email\":\"$LH_ADMIN_EMAIL\",\"password\":\"$LH_ADMIN_PASSWORD\"}" | python -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          BEFORE=$(curl -s http://localhost:8787/admin/marketplace/public-booking-queue -H "Authorization: Bearer $TOK" | wc -c)
          kill "$(cat /tmp/srv.pid)"; sleep 2
          python server.py & echo $! > /tmp/srv.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8787/readyz && break; sleep 1; done
          TOK2=$(curl -s -X POST http://localhost:8787/login -H 'Content-Type: application/json' \
                 -d "{\"email\":\"$LH_ADMIN_EMAIL\",\"password\":\"$LH_ADMIN_PASSWORD\"}" | python -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          AFTER=$(curl -s http://localhost:8787/admin/marketplace/public-booking-queue -H "Authorization: Bearer $TOK2" | wc -c)
          echo "queue bytes before restart=$BEFORE after restart=$AFTER"
          test "$BEFORE" -ge 2
          test "$AFTER" -eq "$BEFORE"
          kill "$(cat /tmp/srv.pid)" || true

      - name: Gate 5 — backup/restore reconciliation drill
        run: |
          python scripts/go_live/backup_restore.py
          python scripts/go_live/backup_restore.py --postgres
