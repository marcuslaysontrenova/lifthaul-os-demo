<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiftHaul OS — Enterprise Administration</title>
<style>
  :root{
    --brand:#5FBE2A; --accent:#F2611A; --gold:#F2C21A; --ink:#0C2306;
    --nav:#0A1705; --nav-2:#12240b; --line:#e3e8de; --surface:#ffffff; --surface-2:#f6f8f4;
    --muted:#5b6b52; --danger:#c0392b; --ok:#2e7d32;
    --mode-view:#5b6b7b; --mode-edit:#5FBE2A; --mode-approval:#F2C21A; --mode-finance:#F2611A; --mode-dispatch:#2f6fb0;
  }
  *{box-sizing:border-box;margin:0} body{font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--surface-2)}
  a{color:inherit}
  /* login */
  #login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 120% at 80% -20%,rgba(242,97,26,.18),transparent 55%),linear-gradient(120deg,#0C2306,#18400e)}
  #login .card{background:#fff;border-radius:16px;padding:32px;width:min(380px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.4)}
  #login h1{font-size:19px;margin-bottom:4px} #login p{color:var(--muted);font-size:13px;margin-bottom:18px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 5px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border:0;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;font-family:inherit}
  .btn:hover{background:#d9520f} .btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#eef1ea}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  /* shell */
  #app{display:none;grid-template-columns:264px 1fr;min-height:100vh}
  .side{background:var(--nav);color:#cfe0c3;padding:0 0 24px} .side .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side .brand b{color:#fff;font-size:15px} .side .brand .tag{color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .side .sect{padding:14px 18px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7fa06a;font-weight:800}
  .side .item{display:block;padding:8px 18px;font-size:13.5px;color:#cfe0c3;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
  .side .item:hover{background:var(--nav-2);color:#fff} .side .item.active{background:var(--nav-2);color:#fff;border-left-color:var(--accent)}
  .main{display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
  .top .who{font-size:13px;color:var(--muted)} .top .who b{color:var(--ink)}
  .content{padding:22px 24px;overflow:auto}
  h2.screen{font-size:20px;margin-bottom:2px} .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--surface-2);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  tr:last-child td{border-bottom:0} .wrap{overflow-x:auto}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.ACTIVE{background:#e7f5e1;color:var(--ok)} .pill.INACTIVE,.pill.ARCHIVED,.pill.SUSPENDED,.pill.LOCKED,.pill.DEACTIVATED{background:#fde8e6;color:var(--danger)}
  .empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px}
  .tree ul{list-style:none;margin:0;padding-left:18px} .tree>ul{padding-left:0}
  .tree li{padding:3px 0;font-size:13.5px} .tree .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13.5px}
  .kv .k{color:var(--muted)}
  /* dialog (Dialog Standard, Vol 3) */
  .ov{position:fixed;inset:0;background:rgba(12,35,6,.5);display:none;place-items:center;z-index:20}
  .ov.open{display:grid}
  .dlg{background:#fff;border-radius:14px;width:min(460px,94vw);box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
  .dlg .head{padding:14px 18px;border-bottom:1px solid var(--line)}
  .dlg .chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:3px 9px;border-radius:6px;margin-bottom:8px}
  .dlg .body{padding:16px 18px;max-height:60vh;overflow:auto} .dlg .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .dlg h3{font-size:16px} .dlg .rule{color:var(--muted);font-size:12px;margin-top:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h1>LiftHaul&nbsp;OS <span style="color:var(--accent)">Administration</span></h1>
    <p>Enterprise Administration Portal · Platform 1</p>
    <label>Backend URL</label><input id="api" placeholder="http://localhost:8787">
    <label>Email</label><input id="email" placeholder="admin@rgo.demo">
    <label>Password</label><input id="pw" type="password" placeholder="••••••••">
    <label>MFA code <span style="text-transform:none;color:#9aa">(if enrolled)</span></label><input id="mfa" placeholder="optional">
    <div style="margin-top:16px"><button class="btn" onclick="doLogin()">Sign in →</button></div>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- SHELL -->
<div id="app">
  <nav class="side">
    <div class="brand"><span style="font-size:22px">🛡️</span><div><b>LiftHaul&nbsp;OS</b><div class="tag">Administration</div></div></div>
    <div id="menu"></div>
  </nav>
  <div class="main">
    <div class="top">
      <div id="crumb" style="font-weight:700"></div>
      <div class="who">Signed in as <b id="whoami">—</b> · <a style="color:var(--accent);cursor:pointer" onclick="logout()">Sign out</a></div>
    </div>
    <div class="content" id="content"><div class="empty">Select an item from the menu.</div></div>
  </div>
</div>

<!-- DIALOG -->
<div class="ov" id="ov"><div class="dlg">
  <div class="head"><span class="chip" id="dchip"></span><h3 id="dtitle"></h3><div class="rule" id="drule"></div></div>
  <div class="body" id="dbody"></div>
  <div class="foot"><button class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn" id="dsave">Save</button></div>
</div></div>

<script>
// ------------------------------------------------------------------ state
let API = localStorage.getItem('lh_api') || (window.RGO_CONFIG && window.RGO_CONFIG.apiBase) || 'http://localhost:8787';
let TOKEN = sessionStorage.getItem('lh_tok') || null;
let EMAIL = sessionStorage.getItem('lh_email') || null;
document.getElementById('api').value = API;

async function api(method, path, body){
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if(TOKEN) opt.headers['Authorization'] = 'Bearer '+TOKEN;
  if(body!==undefined) opt.body = JSON.stringify(body);
  const res = await fetch(API.replace(/\/$/,'')+path, opt);
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((json && json.error) || ('HTTP '+res.status));
  return json.data;
}

// ------------------------------------------------------------------ auth
async function doLogin(){
  API = document.getElementById('api').value.trim(); localStorage.setItem('lh_api', API);
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  const mfa = document.getElementById('mfa').value.trim();
  document.getElementById('loginErr').textContent='';
  try{
    const d = await api('POST','/login',{email, password:pw, mfa_code:mfa||undefined});
    TOKEN = d.token; EMAIL = email;
    sessionStorage.setItem('lh_tok',TOKEN); sessionStorage.setItem('lh_email',EMAIL);
    enterApp();
  }catch(e){ document.getElementById('loginErr').textContent = 'Sign-in failed: '+e.message; }
}
function logout(){ TOKEN=null; sessionStorage.clear(); document.getElementById('app').style.display='none'; document.getElementById('login').style.display='grid'; }
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('whoami').textContent = EMAIL;
  buildMenu(); select(MENU[0].items[0]);
}

// ------------------------------------------------------------------ menu (the CTO IA)
const MENU = [
  {sect:'Organization', items:[
    {id:'profile', label:'Company Profile'},
    {id:'structure', label:'Organization Structure'},
    {id:'business_unit', label:'Business Units'},
    {id:'branch', label:'Branches'},
    {id:'department', label:'Departments'},
    {id:'team', label:'Teams'},
    {id:'operating_site', label:'Operating Sites'},
    {id:'warehouse', label:'Warehouses'},
    {id:'service_area', label:'Service Areas'},
    {id:'cost_centers', label:'Cost Centers'},
  ]},
  {sect:'People & Access', items:[
    {id:'users', label:'Users'},
    {id:'roles', label:'Roles'},
    {id:'permissions', label:'Permissions'},
    {id:'assignments', label:'Organization Assignments'},
    {id:'effective_access', label:'Effective Access'},
    {id:'sessions', label:'Sessions'},
    {id:'login_history', label:'Login History'},
    {id:'mfa', label:'MFA Status'},
    {id:'sod', label:'Separation of Duties'},
  ]},
  {sect:'Calendars', items:[
    {id:'holiday_cal', label:'Holiday Calendars'},
    {id:'working_cal', label:'Working Calendars'},
    {id:'business_hours', label:'Business Hours'},
  ]},
  {sect:'Security', items:[
    {id:'pw_policy', label:'Password Policy'},
    {id:'auth_policy', label:'Authentication Policy'},
    {id:'authz_mode', label:'Authorization Mode'},
    {id:'sod', label:'Separation of Duties'},
    {id:'sec_events', label:'Security Events'},
  ]},
  {sect:'Configuration', items:[
    {id:'cfg_definitions', label:'Configuration Definitions'},
    {id:'cfg_platform', label:'Platform Settings'},
    {id:'cfg_tenant', label:'Tenant Settings'},
    {id:'cfg_org', label:'Organization Overrides'},
    {id:'cfg_effective', label:'Effective Configuration'},
    {id:'cfg_simulate', label:'Policy Simulation'},
  ]},
  {sect:'CRM Administration', items:[
    {id:'crm_classifications', label:'Customer Classifications'},
    {id:'crm_lead_sales', label:'Lead and Sales Settings'},
    {id:'crm_territories', label:'Territories and Ownership'},
    {id:'crm_credit', label:'Credit and Payment Policies'},
    {id:'crm_pricing', label:'Pricing and Agreements'},
    {id:'crm_duplicate', label:'Duplicate and Merge Rules'},
    {id:'crm_numbering', label:'Customer Numbering'},
    {id:'crm_portal', label:'Portal Policies'},
    {id:'crm_custom_fields', label:'CRM Custom Fields'},
  ]},
  {sect:'Master Data', items:[
    {id:'md_operations', label:'Operations'},
    {id:'md_finance', label:'Finance'},
    {id:'md_geography', label:'Geography'},
    {id:'md_documents', label:'Documents'},
    {id:'md_communication', label:'Communication Templates'},
  ]},
  {sect:'Governance', items:[
    {id:'audit', label:'Audit Trail'},
    {id:'correlation_search', label:'Correlation Search'},
    {id:'backfill_runs', label:'Backfill Runs'},
    {id:'ambiguous', label:'Ambiguous Records'},
    {id:'integrity', label:'Data Integrity'},
  ]},
];
function buildMenu(){
  const m = document.getElementById('menu'); m.innerHTML='';
  MENU.forEach(s=>{
    m.insertAdjacentHTML('beforeend', `<div class="sect">${s.sect}</div>`);
    s.items.forEach(it=>{
      const a = document.createElement('a'); a.className='item'; a.textContent=it.label; a.dataset.id=it.id;
      a.onclick=()=>select(it); m.appendChild(a);
    });
  });
}
let CURRENT=null;
function select(it){
  CURRENT=it;
  document.querySelectorAll('.side .item').forEach(x=>x.classList.toggle('active',x.dataset.id===it.id));
  document.getElementById('crumb').textContent='Administration › '+it.label;
  render(it);
}

// ------------------------------------------------------------------ rendering
const C = ()=>document.getElementById('content');
function table(cols, rows, rowfmt){
  if(!rows || !rows.length) return `<div class="empty">No records.</div>`;
  const head = cols.map(c=>`<th>${c}</th>`).join('');
  const body = rows.map(r=>`<tr>${(rowfmt?rowfmt(r):cols.map(c=>cell(r[c.toLowerCase()]))).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('');
  return `<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function cell(v){ if(v===null||v===undefined) return '<span style="color:#bbb">—</span>'; return String(v); }
function pill(s){ return `<span class="pill ${s}">${s}</span>`; }
async function render(it){
  const c = C(); c.innerHTML = `<div class="empty">Loading…</div>`;
  try{ await SCREENS[it.id](it, c); }
  catch(e){ c.innerHTML = `<div class="note" style="border-left-color:var(--danger);color:var(--danger)">Error: ${e.message}</div>`; }
}
function header(it, sub, actions){
  return `<h2 class="screen">${it.label}</h2><div class="sub">${sub||''}</div>`+(actions?`<div class="bar">${actions}</div>`:'');
}

const SCREENS = {
  // Organization
  profile: async (it,c)=>{ const d=await api('GET','/admin/org/company-profile'); const p=d.profile||{};
    c.innerHTML=header(it,'Tenant-level legal identity. Cascade-governed values live in Configuration.',
      `<button class="btn sm" onclick="dlgProfile()">Edit profile ✎</button>`)+
      `<div class="kv">${['legal_name','trade_name','registration_number','tax_number','country','timezone','default_currency','locale','fiscal_year_start'].map(k=>`<div class="k">${k}</div><div>${cell(p[k])}</div>`).join('')}</div>`; },
  structure: async (it,c)=>{ const d=await api('GET','/admin/org/tree');
    c.innerHTML=header(it,'The full organization graph for this tenant.')+`<div class="tree">${treeHtml(d.tree)}</div>`; },
  cost_centers: async (it,c)=>{ const d=await api('GET','/admin/org/cost-centers');
    c.innerHTML=header(it,'Financial allocation targets.',`<button class="btn sm" onclick="dlgUnit('cost_center')">New cost center +</button>`)+
      table(['Code','Name','Status'], d.cost_centers, r=>[r.code,r.name,pill(r.status)]); },
  // People & Access
  users: async (it,c)=>{ const d=await api('GET','/admin/users');
    c.innerHTML=header(it,'User lifecycle — invite, suspend, lock, offboard.',`<button class="btn sm" onclick="dlgUser()">Invite user +</button>`)+
      table(['Email','Role','Status','Last login'], d.users, r=>[r.email,r.role,pill(r.status),cell(r.last_login_at)]); },
  roles: async (it,c)=>{ const d=await api('GET','/admin/roles');
    c.innerHTML=header(it,'Data-driven roles across the 4-layer administration hierarchy.',`<button class="btn sm" onclick="dlgRole()">New role +</button>`)+
      table(['Code','Name','Layer','Locked'], d.roles, r=>[r.code,r.name,'L'+r.layer,r.system_locked?'🔒':'']); },
  permissions: async (it,c)=>{ const d=await api('GET','/admin/permissions');
    c.innerHTML=header(it,'Capability catalog (module × action).')+table(['Code','Module','Action','Description'], d.permissions, r=>[r.code,r.module,r.action,cell(r.description)]); },
  assignments: async (it,c)=>{ const d=await api('GET','/admin/users');
    c.innerHTML=header(it,'Pick a user to view their organization assignments.')+
      table(['Email','Role','Assignments'], d.users, r=>[r.email,r.role,`<a style="color:var(--accent);cursor:pointer" onclick="showAssign(${r.id},'${r.email}')">view</a>`]); },
  sessions: async (it,c)=>{ const d=await api('GET','/admin/sessions');
    c.innerHTML=header(it,'Active sessions across the platform.')+
      table(['User','IP','Created','Last seen'], d.sessions, r=>[r.user_id,cell(r.ip),cell(r.created_at),cell(r.last_seen)]); },
  login_history: async (it,c)=>{ const d=await api('GET','/admin/login-history');
    c.innerHTML=header(it,'Authentication events (success and failure).')+
      table(['Email','Result','Reason','IP','Time'], d.history, r=>[r.email, r.success?'<span style="color:var(--ok)">success</span>':'<span style="color:var(--danger)">fail</span>', r.reason, cell(r.ip), r.ts]); },
  mfa: async (it,c)=>{ const d=await api('GET','/admin/users');
    const rows=[]; for(const u of d.users){ const m=await api('GET','/admin/users/'+u.id+'/mfa'); rows.push({email:u.email, mfa:m.enrolled?'Enrolled ✓':'Not enrolled'}); }
    c.innerHTML=header(it,'TOTP enrollment status per user.')+table(['Email','MFA'], rows, r=>[r.email,r.mfa]); },
  // Calendars
  holiday_cal: async (it,c)=>{ const d=await api('GET','/admin/holiday-calendars');
    c.innerHTML=header(it,'Named holiday calendars with inheritance.',`<button class="btn sm" onclick="dlgHolCal()">New calendar +</button>`)+
      table(['Code','Name','Scope','Status'], d.calendars, r=>[r.code,r.name,r.scope,pill(r.status)]); },
  working_cal: async (it,c)=>{ const d=await api('GET','/admin/working-calendars');
    c.innerHTML=header(it,'Working calendars (override + inherit).')+
      table(['Code','Name','Workdays','Shift'], d.calendars, r=>[r.code,r.name,r.workdays,`${r.shift_start}–${r.shift_end}`]); },
  business_hours: async (it,c)=>{ const d=await api('GET','/admin/working-calendars');
    c.innerHTML=header(it,'Business hours derived from working calendars.')+
      table(['Calendar','Shift start','Shift end','Break (min)'], d.calendars, r=>[r.name,r.shift_start,r.shift_end,r.break_minutes]); },
  // Security
  pw_policy: async (it,c)=>{ const d=await api('GET','/admin/security/policies'); const p=d.password_policy;
    c.innerHTML=header(it,'Configuration-governed password rules.',`<button class="btn sm" onclick="dlgSec()">Edit policy ✎</button>`)+
      `<div class="kv"><div class="k">Minimum length</div><div>${p.min_length}</div><div class="k">Complexity required</div><div>${p.complexity}</div></div>`; },
  auth_policy: async (it,c)=>{ const d=await api('GET','/admin/security/policies');
    c.innerHTML=header(it,'MFA policy and login lockout.',`<button class="btn sm" onclick="dlgSec()">Edit policy ✎</button>`)+
      `<div class="kv"><div class="k">MFA policy</div><div>${d.mfa_policy}</div><div class="k">Lockout threshold</div><div>${cell(d.lockout.threshold)}</div><div class="k">Lockout window (min)</div><div>${cell(d.lockout.window_min)}</div></div>`; },
  authz_mode: async (it,c)=>{ const d=await api('GET','/admin/security/policies');
    c.innerHTML=header(it,'RBAC enforcement source (reversible cutover switch).')+
      `<div class="kv"><div class="k">Authorization mode</div><div><b>${d.authorization_mode}</b> <span style="color:var(--muted)">(legacy | hybrid | db)</span></div></div>`; },
  sod: async (it,c)=>{ c.innerHTML=header(it,'Separation of duties (maker ≠ checker).')+
      `<div class="note">Enforced in the commercial spine: quotation approval requires a different actor than the creator; payment verification and job confirmation are separated. Configurable thresholds live under Configuration → Effective Configuration (<code>approval.quotation_threshold</code>).</div>`; },
  sec_events: async (it,c)=>{ const d=await api('GET','/admin/security/events');
    c.innerHTML=header(it,'Failed authentication and security-relevant events.')+
      table(['Email','Reason','IP','Time'], d.events, r=>[r.email,r.reason,cell(r.ip),r.ts]); },
  // Configuration
  cfg_platform: (it,c)=>cfgList(it,c,'platform'),
  cfg_tenant: (it,c)=>cfgList(it,c,'tenant'),
  cfg_org: (it,c)=>cfgList(it,c,['business_unit','branch','department','team']),
  cfg_definitions: async (it,c)=>{ const d=await api('GET','/admin/config/definitions');
    c.innerHTML=header(it,'Typed, governed configuration definitions (registry).')+
      table(['Key','Category','Type','Default','Scopes','Risk','Snapshot'], d.definitions, r=>[r.key,r.category,r.data_type,cell(r.default_value),cell(r.scopes),r.risk_level,r.snapshot_required?'yes':'no']); },
  cfg_simulate: async (it,c)=>{ c.innerHTML=header(it,'Simulate a governed policy decision (non-mutating).')+
      `<div class="bar"><select id="sp"><option value="tax">Tax</option><option value="downpayment">Downpayment</option><option value="approval">Approval</option></select>`+
      `<input id="s_taxable" placeholder="taxable/total" style="max-width:160px"><input id="s_disc" placeholder="discount % (approval)" style="max-width:150px"><input id="s_tenant" placeholder="tenant (optional)" style="max-width:150px"><button class="btn sm" onclick="doSimulate()">Simulate</button></div><div id="simres"></div>`; },
  cfg_effective: async (it,c)=>{ c.innerHTML=header(it,'Resolve a configuration key down the org cascade.')+
      `<div class="bar"><input id="ck" placeholder="key e.g. approval.quotation_threshold" style="max-width:340px"><input id="cb" placeholder="branch id (optional)" style="max-width:160px"><button class="btn sm" onclick="doResolve()">Resolve</button></div><div id="cres"></div>`; },
  // Effective access (from the real authorization service)
  effective_access: async (it,c)=>{ const d=await api('GET','/admin/users');
    c.innerHTML=header(it,'Pick a user to see their effective permissions, resolved by the authorization service.')+
      table(['Email','Role','Effective access'], d.users, r=>[r.email,r.role,`<a style="color:var(--accent);cursor:pointer" onclick="showEffective(${r.id},'${r.email}')">inspect</a>`]); },
  // Governance
  correlation_search: async (it,c)=>{ c.innerHTML=header(it,'Trace every governed write in one request by correlation ID.')+
      `<div class="bar"><input id="cor" placeholder="correlation id (or blank for latest)" style="max-width:320px"><button class="btn sm" onclick="doCorr()">Search</button></div><div id="corres"></div>`;
    doCorr(); },
  backfill_runs: async (it,c)=>{ const s=await api('GET','/admin/governance/backfill-status');
    c.innerHTML=header(it,'Tenant/organization backfill of operational records.',
      `<button class="btn sm ghost" onclick="doBackfill('backfill-analyze','GET')">Analyze</button> <button class="btn sm ghost" onclick="doBackfill('backfill-dry-run','POST')">Dry run</button> <button class="btn sm" onclick="doBackfill('backfill-execute','POST')">Execute</button>`)+

      `<h3 style="margin:16px 0 8px;font-size:14px">Per-table</h3>`+table(['Table','Total','Unassigned tenant'], s.tables, r=>[r.table,r.total,r.unassigned_tenant])+`<div id="bfres"></div>`; },
  ambiguous: async (it,c)=>{ const d=await api('GET','/admin/governance/backfill-remediation');

  audit: async (it,c)=>{ const d=await api('GET','/admin/audit');

      table(['Time','Actor','Action','Entity','Id','Correlation'], d.audit, r=>[r.ts,r.actor,r.action,r.entity,r.entity_id,cell(r.correlation_id)]); },
  backfill: async (it,c)=>{ const d=await api('GET','/admin/governance/backfill-status');
    c.innerHTML=header(it,'Tenant/organization backfill of operational records.')+
      `<div class="kv"><div class="k">Status</div><div><b>${d.status}</b></div><div class="k">Plan</div><div>${d.plan}</div><div class="k">Note</div><div>${d.note}</div></div>`; },
  integrity: async (it,c)=>{ const d=await api('GET','/admin/governance/data-integrity');
    c.innerHTML=header(it,'Referential integrity checks.')+
      `<div class="kv"><div class="k">Overall</div><div>${d.ok?'<span style="color:var(--ok)">OK ✓</span>':'<span style="color:var(--danger)">issues found</span>'}</div>${Object.entries(d.checks).map(([k,v])=>`<div class="k">${k}</div><div>${v}</div>`).join('')}</div>`; },
  // CRM Administration
  crm_classifications: (it,c)=>crmDomainScreen(it,c,'CRM classification',
    ['customer.category','customer.type','customer.industry','customer.group','customer.account_status',
     'customer.account_rating','customer.credit_rating','customer.risk_class','customer.lifecycle',
     'customer.strategic_indicator','contact.classification','address.type']),
  crm_lead_sales: (it,c)=>crmDomainScreen(it,c,'Lead & sales',

  crm_territories: (it,c)=>crmDomainScreen(it,c,'Territory',['sales.territory']),
  crm_portal: (it,c)=>crmDomainScreen(it,c,'Portal policy',['portal.access_policy','portal.eligibility']),
  crm_pricing: async (it,c)=>{ const d=await api('POST','/admin/crm/pricing/search',{});
    c.innerHTML=header(it,'Pricing policies and agreements (descriptive; does not alter quote math).',
      `<button class="btn sm" onclick="crmPricingNew()">New pricing policy +</button>`)+
      table(['Code','Name','Status'], d.values, r=>[r.code,r.name,pill(r.status)]); },
  crm_credit: async (it,c)=>{ const d=await api('GET','/admin/crm/credit-policies');
    c.innerHTML=header(it,'Effective-dated credit policies. Enforcement is governed by <code>crm.credit.enforcement</code> (default evidence-only — never mutates historical documents).',
      `<button class="btn sm" onclick="crmCreditNew()">New credit policy +</button>`)+
      table(['Code','Name','Credit limit','Terms','Deposit %','Restrictions','Effective to'], d.policies,
        r=>[r.code,cell(r.name),cell(r.credit_limit),cell(r.payment_terms),cell(r.deposit_required_pct),
            [r.booking_restriction?'booking':'',r.service_suspension?'service':'',r.overdue_restriction?'overdue':''].filter(Boolean).join(', ')||'—',cell(r.effective_to)]); },
  crm_duplicate: async (it,c)=>{ const d=await api('GET','/admin/crm/duplicate-rules');
    c.innerHTML=header(it,'Configurable duplicate-detection rules (advisory — never auto-merge). Merge is governed and cross-tenant blocked.',
      `<button class="btn sm" onclick="crmDupNew()">New rule +</button> <button class="btn sm ghost" onclick="crmMergeDlg()">Merge customers…</button>`)+
      table(['Rule','Dimension','Match type','Weight'], d.rules, r=>[r.name,r.dimension,r.match_type,r.weight]); },
  crm_numbering: async (it,c)=>{ const d=await api('POST','/admin/crm/numbering/preview',{});
    const cfg=d.config;
    c.innerHTML=header(it,'Governed, concurrency-safe customer numbering.')+
      `<div class="kv"><div class="k">Enabled</div><div>${cfg.enabled?'yes':'no'}</div><div class="k">Next number (preview)</div><div><b>${d.preview}</b></div><div class="k">Prefix</div><div>${cfg.prefix}</div><div class="k">Include year</div><div>${cfg.include_year}</div><div class="k">Padding</div><div>${cfg.padding}</div><div class="k">Reset</div><div>${cfg.reset}</div></div>`+
      `<div class="bar" style="margin-top:14px"><input id="np" placeholder="prefix" value="${cfg.prefix}" style="max-width:120px"><input id="npad" placeholder="padding" value="${cfg.padding}" style="max-width:100px"><button class="btn sm" onclick="crmNumSave()">Save numbering</button></div>`; },
  crm_custom_fields: async (it,c)=>{ const d=await api('POST','/admin/crm/custom-fields/search',{});
    c.innerHTML=header(it,'Declarative CRM custom fields (no executable code in validation).',
      `<button class="btn sm" onclick="crmCfNew()">New custom field +</button>`)+
      table(['Entity','Code','Label','Type','Required','Status'], d.fields,
        r=>[r.entity,r.code,r.label,r.data_type,r.required?'yes':'',pill(r.status)]); },
  // Master Data Center
  md_operations: (it,c)=>mdCategoryScreen(it,c,'OPERATIONS'),
  md_finance: (it,c)=>mdCategoryScreen(it,c,'FINANCE'),
  md_geography: (it,c)=>mdCategoryScreen(it,c,'GEOGRAPHY'),
  md_documents: (it,c)=>mdCategoryScreen(it,c,'DOCUMENTS'),
  md_communication: (it,c)=>mdCategoryScreen(it,c,'DOCUMENTS'),
};
// ---- CRM / Master-Data helper screens (every action hits a persisted API) ----
async function crmDomainScreen(it,c,label,domains){
  const opts=domains.map(d=>`<option value="${d}">${d}</option>`).join('');
  c.innerHTML=header(it,label+' reference values (governed master data).',
    `<select id="mdd" onchange="crmDomainLoad()" style="max-width:280px">${opts}</select> <button class="btn sm" onclick="crmClassNew()">New value +</button>`)+
    `<div id="mdlist"><div class="empty">Loading…</div></div>`;
  crmDomainLoad();
}
async function crmDomainLoad(){ const domain=document.getElementById('mdd').value;
  const d=await api('POST','/admin/crm/classifications/search',{domain});
  document.getElementById('mdlist').innerHTML=table(['Code','Name','Status','Actions'], d.values,
    r=>[r.code,r.name,pill(r.status),
      r.status==='ACTIVE'?`<a style="color:var(--accent);cursor:pointer" onclick="crmClassStatus(${r.id},'INACTIVE')">deactivate</a> · <a style="color:var(--accent);cursor:pointer" onclick="mdDeps(${r.id})">impact</a>`
                         :`<a style="color:var(--accent);cursor:pointer" onclick="crmClassStatus(${r.id},'ACTIVE')">activate</a>`]); }
async function crmClassNew(){ const domain=document.getElementById('mdd').value;
  const code=prompt('Code (e.g. VIP):'); if(!code) return; const name=prompt('Name:')||code;
  try{ await api('POST','/admin/crm/classifications',{domain,code,name}); crmDomainLoad(); }catch(e){ alert(e.message); } }
async function crmClassStatus(id,status){ try{ await api('POST','/admin/crm/classifications/'+id+'/status',{status,reason:'console'}); crmDomainLoad(); }catch(e){ alert(e.message); } }
async function mdCategoryScreen(it,c,category){
  const d=await api('GET','/admin/master-data/domains');
  const domains=d.domains.filter(x=>x.category===category);
  const opts=domains.map(x=>`<option value="${x.domain}">${x.label} (${x.values})</option>`).join('');
  c.innerHTML=header(it,category.charAt(0)+category.slice(1).toLowerCase()+' master data.',
    `<select id="mdd" onchange="mdLoad()" style="max-width:320px">${opts}</select> <button class="btn sm" onclick="mdNew()">New value +</button> <button class="btn sm ghost" onclick="mdImportDlg()">Import…</button> <button class="btn sm ghost" onclick="mdExport()">Export</button>`)+
    `<div id="mdlist"><div class="empty">Loading…</div></div>`;
  mdLoad();
}
async function mdLoad(){ const domain=document.getElementById('mdd').value;
  const d=await api('POST','/admin/master-data/values/search',{domain});
  document.getElementById('mdlist').innerHTML=table(['Code','Name','Status','Actions'], d.values,
    r=>[r.code,r.name,pill(r.status),
      r.status==='ACTIVE'?`<a style="color:var(--accent);cursor:pointer" onclick="mdStatus(${r.id},'INACTIVE')">deactivate</a> · <a style="color:var(--accent);cursor:pointer" onclick="mdDeps(${r.id})">impact</a>`
                         :`<a style="color:var(--accent);cursor:pointer" onclick="mdStatus(${r.id},'ACTIVE')">activate</a> · <a style="color:var(--accent);cursor:pointer" onclick="mdReplace(${r.id})">replace</a>`]); }
async function mdNew(){ const domain=document.getElementById('mdd').value;
  const code=prompt('Code:'); if(!code) return; const name=prompt('Name:')||code;
  try{ await api('POST','/admin/master-data/values',{domain,code,name}); mdLoad(); }catch(e){ alert(e.message); } }
async function mdStatus(id,status){ try{ await api('POST','/admin/master-data/values/'+id+'/status',{status,reason:'console'}); mdLoad(); }catch(e){ alert(e.message); } }
async function mdDeps(id){ const d=await api('GET','/admin/master-data/values/'+id+'/dependencies');
  openDlg('view','Dependency impact',`${d.value.code} — ${d.total_references} referencing record(s)`,
    table(['Table','Column','Records'], d.references, r=>[r.table,r.column,r.records])+
    `<p style="margin-top:10px;color:var(--muted);font-size:12px">Safe to hard-delete: ${d.safe_to_hard_delete?'yes':'no (deactivate/replace instead)'} · Replacement options: ${d.replacement_options.length}</p>`, null); }
async function mdReplace(id){ const rid=prompt('Replacement value id:'); if(!rid) return;
  try{ await api('POST','/admin/master-data/values/'+id+'/replace',{replacement_id:parseInt(rid),reason:'console'}); mdLoad(); }catch(e){ alert(e.message); } }
async function mdImportDlg(){ const domain=document.getElementById('mdd').value;
  const raw=prompt('Paste rows as code,name per line:'); if(!raw) return;
  const rows=raw.split('\n').map(l=>{const [code,...n]=l.split(','); return {code:(code||'').trim(), name:(n.join(',')||'').trim()};}).filter(r=>r.code);
  const dry=await api('POST','/admin/master-data/import',{domain,rows,dry_run:true});
  if(!confirm(`Dry run: ${dry.valid} valid, ${dry.invalid} invalid, ${dry.duplicates} duplicate. Apply valid rows?`)) return;
  await api('POST','/admin/master-data/import',{domain,rows,dry_run:false}); mdLoad(); }
async function mdExport(){ const domain=document.getElementById('mdd').value;
  const d=await api('POST','/admin/master-data/export',{domain});
  openDlg('view','Export — '+domain, d.rows.length+' rows (tenant-scoped)', table(['Code','Name','Status'], d.rows, r=>[r.code,r.name,cell(r.status)]), null); }
async function crmPricingNew(){ const code=prompt('Pricing policy code:'); if(!code) return; const name=prompt('Name:')||code;
  try{ await api('POST','/admin/crm/pricing',{code,name}); render(CURRENT); }catch(e){ alert(e.message); } }
async function crmCreditNew(){ const code=prompt('Credit policy code:'); if(!code) return; const name=prompt('Name:')||code;
  const limit=prompt('Credit limit (blank = none):'); const terms=prompt('Payment terms (e.g. NET30):');
  try{ await api('POST','/admin/crm/credit-policies',{code,name,credit_limit:limit?parseFloat(limit):null,payment_terms:terms||null}); render(CURRENT); }catch(e){ alert(e.message); } }
async function crmDupNew(){ const name=prompt('Rule name:'); if(!name) return; const dim=prompt('Dimension (legal_name/email/phone/tax_id):'); if(!dim) return;
  const mt=prompt('Match type (exact/normalized/weighted):','exact')||'exact'; const w=prompt('Weight:','1.0')||'1.0';
  try{ await api('POST','/admin/crm/duplicate-rules',{name,dimension:dim,match_type:mt,weight:parseFloat(w)}); render(CURRENT); }catch(e){ alert(e.message); } }
async function crmMergeDlg(){ const s=prompt('Survivor customer id:'); const m=prompt('Merged (loser) customer id:'); if(!s||!m) return;
  try{ const prev=await api('POST','/admin/crm/merge/preview',{survivor_id:parseInt(s),merged_id:parseInt(m)});
    const rels=prev.relationships.map(r=>`${r.table}:${r.records}`).join(', ');
    if(!confirm(`Merge ${prev.merged.name} into ${prev.survivor.name}? Redirects — ${rels}`)) return;
    await api('POST','/admin/crm/merge',{survivor_id:parseInt(s),merged_id:parseInt(m),reason:'console merge'});
    alert('Merged.'); }catch(e){ alert(e.message); } }
async function crmNumSave(){ const prefix=document.getElementById('np').value; const padding=document.getElementById('npad').value;
  try{ await api('POST','/admin/crm/numbering/config',{prefix,padding:parseInt(padding)}); render(CURRENT); }catch(e){ alert(e.message); } }
async function crmCfNew(){ const entity=prompt('Entity (customer/contact/address/lead/opportunity/booking):','customer'); if(!entity) return;
  const code=prompt('Field code:'); if(!code) return; const label=prompt('Label:')||code;
  const dt=prompt('Data type (text/integer/decimal/boolean/date/email/single_select):','text')||'text';
  try{ await api('POST','/admin/crm/custom-fields',{entity,code,label,data_type:dt}); render(CURRENT); }catch(e){ alert(e.message); } }
// generic org-unit kind screens
['business_unit','branch','department','team','operating_site','warehouse','service_area'].forEach(kind=>{
  SCREENS[kind] = async (it,c)=>{ const d=await api('POST','/admin/org/units/search',{kind});
    c.innerHTML=header(it,`Organization units of kind “${kind}”.`,`<button class="btn sm" onclick="dlgUnit('${kind}')">New +</button>`)+
      table(['Code','Name','Status'], d.units, r=>[r.code,r.name,pill(r.status)]); };
});
function treeHtml(nodes){ if(!nodes||!nodes.length) return '<div class="empty">No organization units yet.</div>';
  const li = n=>`<li><span class="k">${n.kind}</span> <b>${n.code}</b> — ${n.name} ${n.status!=='ACTIVE'?pill(n.status):''}${n.children&&n.children.length?`<ul>${n.children.map(li).join('')}</ul>`:''}</li>`;
  return `<ul>${nodes.map(li).join('')}</ul>`; }
async function cfgList(it,c,scopes){ const d=await api('GET','/admin/config'); const set=[].concat(scopes);
  const rows=d.config.filter(r=>set.includes(r.scope));
  c.innerHTML=header(it,'Configuration values ('+set.join(', ')+').',`<button class="btn sm" onclick="dlgCfg('${set[0]}')">Set value +</button>`)+
    table(['Scope','Ref','Key','Value','Expires'], rows, r=>[r.scope,cell(r.scope_ref),r.key,r.value,cell(r.effective_to)]); }
async function doResolve(){ const key=document.getElementById('ck').value.trim(); const br=document.getElementById('cb').value.trim();
  const body={key, tenant:'1'}; if(br) body.branch=br;
  try{ const r=await api('POST','/admin/config/effective',body);
    document.getElementById('cres').innerHTML=`<div class="kv"><div class="k">Value</div><div><b>${cell(r.value)}</b></div><div class="k">Source scope</div><div>${cell(r.scope)}</div><div class="k">Source ref</div><div>${cell(r.scope_ref)}</div><div class="k">Fallback path</div><div>${(r.fallback_path||[]).join(' → ')}</div></div>`;
  }catch(e){ document.getElementById('cres').innerHTML=`<div class="note" style="border-left-color:var(--danger);color:var(--danger)">${e.message}</div>`; } }
async function showAssign(uid,email){ const d=await api('GET','/admin/users/'+uid+'/assignments');
  openDlg('view','Organization assignments','User: '+email, table(['Kind','Scope id','Type','Status'], d.assignments, r=>[r.scope_kind,r.scope_id,r.assignment_type,pill(r.status)]), null); }
async function showEffective(uid,email){ const d=await api('GET','/admin/users/'+uid+'/effective-access');
  const body = `<p style="color:var(--muted);font-size:12px;margin-bottom:8px">Roles: ${d.roles.map(r=>r.code).join(', ')||'none'}</p>`+
    table(['Permission','Source role','Type'], d.grants, r=>[r.permission,r.source_role,r.source]);
  openDlg('view','Effective access','User: '+email+' — resolved by the authorization service', body, null); }
async function doCorr(){ const cid=(document.getElementById('cor')||{}).value; const d=await api('GET','/admin/audit');
  const rows=d.audit.filter(r=>!cid||r.correlation_id===cid);
  const el=document.getElementById('corres'); if(el) el.innerHTML=table(['Time','Actor','Action','Entity','Id','Correlation'], rows, r=>[r.ts,r.actor,r.action,r.entity,r.entity_id,cell(r.correlation_id)]); }
async function doBackfill(op,method){ try{ const r=await api(method,'/admin/governance/'+op); const el=document.getElementById('bfres');
    if(el) el.innerHTML=`<div class="note" style="margin-top:12px"><b>${op}</b>: ${JSON.stringify(r).slice(0,400)}</div>`; if(op==='backfill-execute') render(CURRENT);
  }catch(e){ alert(e.message); } }
async function resolveRem(id){ if(!confirm('Mark this remediation resolved?')) return; try{ await api('POST','/admin/governance/backfill-remediation/'+id+'/resolve'); render(CURRENT); }catch(e){ alert(e.message); } }
async function doSimulate(){ const kind=document.getElementById('sp').value; const amt=parseFloat(document.getElementById('s_taxable').value||'0');
  const body={policy:kind}; if(kind==='tax') body.taxable=amt; else body.total=amt; if(kind==='approval') body.discount_pct=parseFloat(document.getElementById('s_disc').value||'0');
  const t=document.getElementById('s_tenant').value; if(t) body.tenant=t;
  try{ const r=await api('POST','/admin/config/simulate',body);
    document.getElementById('simres').innerHTML=`<div class="kv">${Object.entries(r).filter(([k])=>k!=='snapshot').map(([k,v])=>`<div class="k">${k}</div><div>${typeof v==='object'?JSON.stringify(v):cell(v)}</div>`).join('')}</div>`;
  }catch(e){ document.getElementById('simres').innerHTML=`<div class="note" style="border-left-color:var(--danger);color:var(--danger)">${e.message}</div>`; } }

// ------------------------------------------------------------------ Dialog Standard
const MODE={view:'View',edit:'Edit',approval:'Approval Required',finance:'Finance Action',dispatch:'Dispatch Action'};
function openDlg(mode,title,rule,bodyHtml,onSave){
  document.getElementById('dchip').textContent=MODE[mode];
  document.getElementById('dchip').style.background='var(--mode-'+mode+')';
  document.getElementById('dtitle').textContent=title;
  document.getElementById('drule').textContent=rule||'';
  document.getElementById('dbody').innerHTML=bodyHtml;
  const save=document.getElementById('dsave');
  save.style.display=onSave?'inline-flex':'none';
  save.onclick=async()=>{ try{ await onSave(); closeDlg(); render(CURRENT); }catch(e){ alert(e.message); } };
  document.getElementById('ov').classList.add('open');
}
function closeDlg(){ document.getElementById('ov').classList.remove('open'); }
const val=id=>document.getElementById(id).value.trim();
function field(id,label,ph){ return `<label>${label}</label><input id="${id}" placeholder="${ph||''}">`; }

  ()=>api('POST','/admin/org/units',{kind,code:val('u_code'),name:val('u_name'),parent_id:val('u_parent')?parseInt(val('u_parent')):undefined})); }

  `<label>Role</label><select id="nu_role"><option>estimator</option><option>approver</option><option>finance</option><option>dispatcher</option><option>operations_manager</option></select>`,
  ()=>api('POST','/admin/users',{email:val('nu_email'),name:val('nu_name'),password:val('nu_pw'),role:val('nu_role')})); }

  `<label>MFA policy</label><select id="s_mfa"><option>optional</option><option>required</option><option>off</option></select>`+field('s_lock','Lockout threshold','5'),
  ()=>api('POST','/admin/security/policies',{'auth.pw_min_length':val('s_min'),'auth.pw_require_complexity':val('s_cx'),'auth.mfa_policy':val('s_mfa'),'auth.lockout_threshold':val('s_lock')})); }

  `<label>Scope</label><select id="cf_scope"><option>platform</option><option>tenant</option><option>branch</option><option>department</option></select>`+

if(TOKEN){ enterApp(); }
