name: LiftHaul Exact Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA already merged to main
        required: true
        type: string
      authorize_synthetic_bookings:
        description: Explicitly authorize creation of synthetic no-funds production booking records
        required: true
        type: boolean
        default: false
      deployment_mode:
        description: Deploy through Railway, or accept an exact SHA already deployed by an authorized operator
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - verify_existing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifthaul-production
  cancel-in-progress: false

jobs:
  reliability:
    name: Verify recovery and concurrency controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Backup, destructive incident, restore and reconcile
        run: python scripts/go_live/backup_restore.py
      - name: Concurrent registration isolation and backpressure
        run: python scripts/go_live/concurrency_loadtest.py --clients 40

  verify:
    name: Verify the exact release candidate
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.sha.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - id: sha
        name: Reject abbreviated, unmerged, or mismatched commits
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.release_sha }}'
          actual=$(git rev-parse HEAD)
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]
          [ "${requested,,}" = "$actual" ]
          # Keep the complete graph fetched by checkout. A depth-1 fetch of main
          # hides a merge commit's second parent and incorrectly rejects the
          # exact PR head even though it is already merged into main.
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$actual" origin/main
          echo "release_sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Complete Python regression suite
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m unittest discover -p 'test_*.py'
      - name: Static security and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install bandit==1.9.4 pip-audit==2.10.1
          mapfile -d '' files < <(find backend -maxdepth 1 -type f -name '*.py' ! -name 'test_*' -print0)
          python -m bandit "${files[@]}" -ll -iii
          python -m pip_audit -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Browser UAT release gate
        working-directory: ci/browser
        run: |
          mkdir -p ../artifacts
          npm install
          npx playwright install --with-deps chromium firefox webkit
          python -m http.server 8080 --directory ../.. > ../artifacts/frontend.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/driver-register.html >/dev/null && break; sleep 1; done
          APP_BASE=http://127.0.0.1:8080 npx playwright test --config playwright.public-ui.config.js

  deploy-backend:
    name: Verify exact backend SHA and run synthetic smoke
    needs: [verify, reliability]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployment_id: ${{ steps.identity.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
      - id: deploy
        if: ${{ inputs.deployment_mode == 'deploy' }}
        name: Request exact-commit Railway deployment
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: python scripts/go_live/railway_deploy_exact.py
      - name: Wait for healthy deployment identity
        if: ${{ inputs.deployment_mode == 'deploy' }}
        env:
          API_URL: https://www.lifthaul.com.ph
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            actual=$(curl -fsS "$API_URL/readyz" | python -c 'import json,sys; print(json.load(sys.stdin).get("release_sha", ""))' || true)
            [ "$actual" = "$RELEASE_SHA" ] && exit 0
            sleep 10
          done
          echo "production never reported the exact tested SHA" >&2
          exit 1
      - id: identity
        name: Bind acceptance to the exact live deployment identity
        env:
          API_URL: https://www.lifthaul.com.ph
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          REQUESTED_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "$API_URL/readyz" -o ready.json
          python - <<'PY'
          import json
          import os
          import re

          ready = json.load(open("ready.json", encoding="utf-8"))
          expected_sha = os.environ["RELEASE_SHA"]
          requested_id = os.environ.get("REQUESTED_DEPLOYMENT_ID", "").strip()
          observed_sha = str(ready.get("release_sha", ""))
          deployment_id = str(ready.get("deployment_id", "")).strip()
          assert ready.get("status") == "ready", ready
          assert ready.get("schema_version") is not None, ready
          assert observed_sha == expected_sha, (observed_sha, expected_sha)
          assert re.fullmatch(r"[0-9a-fA-F-]{20,}", deployment_id), deployment_id
          if os.environ["DEPLOYMENT_MODE"] == "deploy":
              assert requested_id, "Railway deploy step returned no deployment id"
              assert deployment_id == requested_id, (deployment_id, requested_id)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"deployment_id={deployment_id}\n")
          print(json.dumps({
              "release_sha": observed_sha,
              "deployment_id": deployment_id,
              "schema_version": ready["schema_version"],
              "mode": os.environ["DEPLOYMENT_MODE"],
          }))
          PY
      - id: public_preflight
        name: Independent public read-only preflight (no secrets)
        continue-on-error: true
        env:
          BASE_URL: https://www.lifthaul.com.ph
          EXPECTED_SHA: ${{ needs.verify.outputs.release_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          LH_PREFLIGHT_EVIDENCE_PATH: evidence/public-preflight.json
        run: python scripts/go_live/preflight.py --scope public
      - id: admin_preflight
        name: Privileged configuration audit (separate admin identity)
        continue-on-error: true
        env:
          BASE_URL: https://www.lifthaul.com.ph
          EXPECTED_SHA: ${{ needs.verify.outputs.release_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          LH_ADMIN_EMAIL: ${{ secrets.LH_PROD_AUDIT_ADMIN_EMAIL }}
          LH_ADMIN_PASSWORD: ${{ secrets.LH_PROD_AUDIT_ADMIN_PASSWORD }}
          LH_PREFLIGHT_EVIDENCE_PATH: evidence/admin-preflight.json
        run: python scripts/go_live/preflight.py --scope admin
      - name: Preserve independent redacted preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-preflight-${{ needs.verify.outputs.release_sha }}
          path: |
            evidence/public-preflight.json
            evidence/admin-preflight.json
          retention-days: 30
          if-no-files-found: warn
      - id: qa_credentials
        name: Verify protected production QA credentials are configured
        if: ${{ inputs.authorize_synthetic_bookings == true && steps.public_preflight.outcome == 'success' && steps.admin_preflight.outcome == 'success' && steps.identity.outcome == 'success' }}
        env:
          LH_ADMIN_EMAIL: ${{ secrets.LH_PROD_TEST_ADMIN_EMAIL }}
          LH_ADMIN_PASSWORD: ${{ secrets.LH_PROD_TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$LH_ADMIN_EMAIL" ] || [ -z "$LH_ADMIN_PASSWORD" ]; then
            echo "::error::Production acceptance is blocked: configure LH_PROD_TEST_ADMIN_EMAIL and LH_PROD_TEST_ADMIN_PASSWORD for the dedicated public_intake_qa account in the protected production environment."
            exit 1
          fi
      - id: regional
        name: Synthetic production journey (no funds)
        if: ${{ inputs.authorize_synthetic_bookings == true && steps.qa_credentials.outcome == 'success' && steps.public_preflight.outcome == 'success' && steps.admin_preflight.outcome == 'success' && steps.identity.outcome == 'success' }}
        env:
          BASE_URL: https://www.lifthaul.com.ph
          EXPECTED_SHA: ${{ needs.verify.outputs.release_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.identity.outputs.deployment_id }}
          LH_ADMIN_EMAIL: ${{ secrets.LH_PROD_TEST_ADMIN_EMAIL }}
          LH_ADMIN_PASSWORD: ${{ secrets.LH_PROD_TEST_ADMIN_PASSWORD }}
          LH_PRODUCTION_SYNTHETIC_BOOKINGS_APPROVED: ${{ inputs.authorize_synthetic_bookings }}
          LH_MVP_EVIDENCE_PATH: evidence/regional-booking-acceptance.json
        run: |
          set -euo pipefail
          python scripts/go_live/prod_e2e.py
          python - <<'PY'
          import json
          import os

          evidence = json.load(open("evidence/regional-booking-acceptance.json", encoding="utf-8"))
          assert evidence.get("result") == "PASS", evidence
          regions = evidence.get("regions") or []
          assert len(regions) == 3, regions
          reference = regions[0].get("reference")
          assert isinstance(reference, str) and reference.startswith("LH-"), reference
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"booking_ref={reference}\n")
          PY
      - id: protected_qa
        name: Least-privilege authenticated QA reads the exact persisted booking
        if: ${{ inputs.authorize_synthetic_bookings == true && steps.regional.outcome == 'success' && steps.qa_credentials.outcome == 'success' }}
        env:
          BASE_URL: https://www.lifthaul.com.ph
          EXPECTED_SHA: ${{ needs.verify.outputs.release_sha }}
          LH_TEST_BOOKING_REF: ${{ steps.regional.outputs.booking_ref }}
          LH_ADMIN_EMAIL: ${{ secrets.LH_PROD_TEST_ADMIN_EMAIL }}
          LH_ADMIN_PASSWORD: ${{ secrets.LH_PROD_TEST_ADMIN_PASSWORD }}
        run: python scripts/go_live/prod_auth_qa.py
      - name: Enforce complete acceptance (public, admin, regional)
        if: always()
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          PUBLIC_PREFLIGHT: ${{ steps.public_preflight.outcome }}
          ADMIN_PREFLIGHT: ${{ steps.admin_preflight.outcome }}
          REGIONAL_QA: ${{ steps.regional.outcome }}
          QA_CREDENTIALS: ${{ steps.qa_credentials.outcome }}
          PROTECTED_QA: ${{ steps.protected_qa.outcome }}
          SYNTHETIC_APPROVED: ${{ inputs.authorize_synthetic_bookings }}
        run: |
          python - <<'PY'
          import os
          checks = {name: os.environ[name] for name in (
              "IDENTITY", "PUBLIC_PREFLIGHT", "ADMIN_PREFLIGHT", "QA_CREDENTIALS", "REGIONAL_QA", "PROTECTED_QA"
          )}
          print("Production acceptance outcomes:", checks)
          assert os.environ["SYNTHETIC_APPROVED"] == "true", "Synthetic production booking approval is missing"
          assert all(value == "success" for value in checks.values()), (
              "INCOMPLETE production acceptance: missing, failed or skipped required evidence"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-booking-acceptance-${{ needs.verify.outputs.release_sha }}
          path: evidence/regional-booking-acceptance.json
          retention-days: 30

  deploy-frontend:
    name: Deploy exact static frontend to GitHub Pages
    needs: [verify, deploy-backend]
    runs-on: ubuntu-latest
    if: ${{ inputs.deployment_mode == 'deploy' }}
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
      - name: Build least-privilege public artifact
        run: |
          mkdir -p public-dist
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.html' --include='*.css' --include='*.js' \
            --include='*.json' --include='*.svg' --include='*.png' --include='*.webp' \
            --exclude='*' ./ public-dist/
          rm -rf public-dist/backend public-dist/ci public-dist/docs public-dist/scripts public-dist/prototypes
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public-dist }
      - id: pages
        uses: actions/deploy-pages@v4

  evidence:
    name: Record immutable release evidence
    needs: [verify, reliability, deploy-backend, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write release manifest
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          DEPLOYMENT_ID: ${{ needs.deploy-backend.outputs.deployment_id }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
          RELIABILITY_RESULT: ${{ needs.reliability.result }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          with open('evidence/release.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'release_sha': os.environ.get('RELEASE_SHA'),
                  'backend_deployment_id': os.environ.get('DEPLOYMENT_ID'),
                  'backend_result': os.environ.get('BACKEND_RESULT'),
                  'reliability_result': os.environ.get('RELIABILITY_RESULT'),
                  'frontend_result': os.environ.get('FRONTEND_RESULT'),
                  'github_run_id': os.environ.get('GITHUB_RUN_ID'),
                  'rollback_target': 'previous successful Railway deployment and previous successful Pages artifact',
                  'live_funds_enabled': False,
              }, f, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ needs.verify.outputs.release_sha }}
          path: evidence/release.json

