name: LiftHaul Production Health Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ownership
        name: Validate monitored production ownership
        continue-on-error: true
        env:
          OPERATIONS_OWNER: ${{ vars.LH_PROD_OPERATIONS_OWNER }}
          INCIDENT_OWNER: ${{ vars.LH_PROD_INCIDENT_OWNER }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          [ -n "$OPERATIONS_OWNER" ] || { echo "::error::Set production variable LH_PROD_OPERATIONS_OWNER"; exit 1; }
          [ -n "$INCIDENT_OWNER" ] || { echo "::error::Set production variable LH_PROD_INCIDENT_OWNER"; exit 1; }
          python - <<'PY'
          import json, os
          with open('evidence/ownership.json', 'w', encoding='utf-8') as handle:
              json.dump({
                  'operations_owner': os.environ['OPERATIONS_OWNER'],
                  'incident_owner': os.environ['INCIDENT_OWNER'],
                  'configured': True,
              }, handle, indent=2)
          PY
      - id: surface
        name: Canonical production surface, readiness, and release identity
        if: always()
        continue-on-error: true
        env:
          PRODUCTION_URL: https://www.lifthaul.com.ph
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/" -o evidence/frontend.html
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/healthz" -o evidence/health.json
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/readyz" -o evidence/ready.json
          curl --fail --silent --show-error --max-time 20 \
            "$PRODUCTION_URL/data/psgc/manifest.json" -o evidence/psgc-manifest.json
          python - <<'PY'
          import json
          health=json.load(open('evidence/health.json', encoding='utf-8'))
          ready=json.load(open('evidence/ready.json', encoding='utf-8'))
          psgc=json.load(open('evidence/psgc-manifest.json', encoding='utf-8'))
          frontend=open('evidence/frontend.html', encoding='utf-8').read().lower()
          assert health.get('status') == 'ok', health
          assert ready.get('status') == 'ready', ready
          assert ready.get('schema_version') is not None, ready
          assert ready.get('release_sha') not in (None, '', 'unknown'), ready
          assert psgc, 'PSGC manifest is empty'
          for prohibited in ('demo prototype', 'lifthaul (demo)', 'prototype · in-browser'):
              assert prohibited not in frontend, prohibited
          PY
          deployed_sha=$(python -c "import json; print(json.load(open('evidence/ready.json'))['release_sha'])")
          git merge-base --is-ancestor "$deployed_sha" origin/main
      # Probe results remain available even if owner variables are absent.
      # The final gate still fails closed on either owner or site errors.
      - name: Enforce monitoring ownership and live surface result
        if: always()
        env:
          OWNERSHIP_OUTCOME: ${{ steps.ownership.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
        run: python scripts/go_live/monitor_gate.py
      - name: Open or update the production-health incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_OWNER: ${{ vars.LH_PROD_INCIDENT_OWNER }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Production health monitor is failing'
          number=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          body="Production monitoring failed at ${RUN_URL}. The incident owner must acknowledge, diagnose, and record recovery evidence. No live-funds control should be changed as part of this response."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          elif [ -n "$INCIDENT_OWNER" ]; then
            gh issue create --title "$title" --body "$body" --assignee "$INCIDENT_OWNER"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-health-${{ github.run_id }}
          retention-days: 14
          path: evidence/**

