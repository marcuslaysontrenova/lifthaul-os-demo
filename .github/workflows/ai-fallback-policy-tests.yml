name: AI fallback policy tests (offline)
on:
  pull_request:
    paths:
      - 'scripts/ai/**'
      - '.github/workflows/ai-fallback-policy-tests.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline no-credential fallback simulation
        run: python -m unittest discover -s scripts/ai -p 'test_*.py' -v
