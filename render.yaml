# LiftHaul OS — one-click backend hosting Blueprint (Render).
#
# What this provisions in ONE action ("New + > Blueprint" -> pick this repo):
#   * a managed PostgreSQL database (schema self-applies on first boot via the
#     Dockerfile's `python migrate.py`), and
#   * the LiftHaul API web service (Docker), with DATABASE_URL injected from the
#     database and APP_SECRET generated by Render — neither ever typed by hand.
#
# Set the three unsynchronised values by hand: CORS_ORIGINS plus the initial
# LH_ADMIN_EMAIL and LH_ADMIN_PASSWORD. The application rejects demo credentials.
# Full steps: docs/go_live/BACKEND_HOSTING_RUNBOOK.md
#
# This is a stable-production template, not a free demonstration template. Applying
# it creates billable resources and therefore requires the owner's separate approval.
# Automatic deployment is disabled: release only the exact SHA that passed the gates.

databases:
  - name: lifthaul-db
    databaseName: lifthaul
    user: lifthaul
    plan: 0.5c-1g
    region: singapore
    connectionPool: pgbouncer
    ipAllowList: []
    storageAutoscalingEnabled: true

services:
  - type: web
    name: lifthaul-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /readyz
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: REVENUE_DNA_ENFORCEMENT
        value: enforce
      - key: DATABASE_URL
        fromDatabase:
          name: lifthaul-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true          # Render generates a strong secret; you never see/handle it
      - key: CORS_ORIGINS
        sync: false                  # <-- set to your Pages origin, e.g. https://marcuslaysontrenova.github.io
      - key: LH_ADMIN_EMAIL
        sync: false                  # real operational bootstrap administrator; demo addresses are rejected
      - key: LH_ADMIN_PASSWORD
        sync: false                  # 14+ chars with upper/lower/numeric; no demo default exists
      - key: LIVE_PROTECTED_FUNDS_ENABLED
        value: "false"
      - key: PAYMENT_GATEWAY_MODE
        value: disabled
      - key: PAYMENT_PROVIDER
        value: MOCK
      - key: PAYMENT_PROVIDER_CERTIFIED
        value: "false"
      - key: PAYMENT_PRODUCTION_PILOT_APPROVED
        value: "false"
      - key: PAYMENT_RECONCILIATION_AUTOMATION
        value: "false"
      - key: PAYMENT_REGULATORY_ROLE_APPROVED
        value: "false"
      - key: PAYMENT_SAFEGUARDED_FUNDS_APPROVED
        value: "false"
      - key: PAYMENT_INDEPENDENT_SECURITY_TEST_APPROVED
        value: "false"
      - key: PAYMENT_DR_RESTORE_APPROVED
        value: "false"
      - key: PAYMENT_ENABLED_CHANNELS
        value: ""
      - key: ADMIN_FEE_WISE_ENABLED
        value: "false"
