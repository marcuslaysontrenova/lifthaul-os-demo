# RGO OS — one-command single-node deploy (real, persistent SQLite volume).
# `docker compose up --build`  → API on :8787 with data persisted across restarts.
# Switch to PostgreSQL by enabling the `db` service + DATABASE_URL once the
# lastrowid->RETURNING refactor (see pgcompat.py) lands.
services:
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET (32+ random chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/rgo.sqlite}
      PORT: "8787"
    ports: ["8787:8787"]
    volumes: ["rgo_data:/data"]
    restart: unless-stopped
  # db:                       # enable for PostgreSQL (after the PG refactor)
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: rgo
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
  #   volumes: ["pg_data:/var/lib/postgresql/data"]
volumes:
  rgo_data:
  # pg_data:
