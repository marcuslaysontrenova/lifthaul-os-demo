name: LiftHaul Gate 5 production persona UAT

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit currently reported by production /readyz
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifthaul-production-persona-uat
  cancel-in-progress: false

jobs:
  exact-production-personas:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject non-exact or unmerged commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "${#RELEASE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      # Production accounts must be provisioned and approved separately.
      # Never rotate a bootstrap administrator or mutate Railway from UAT.
      - name: Verify protected read-only persona manifest
        env:
          LH_PROD_PERSONA_CREDENTIALS_JSON: ${{ secrets.LH_PROD_PERSONA_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$LH_PROD_PERSONA_CREDENTIALS_JSON" ]; then
            mkdir -p evidence
            printf '{"schema":"lifthaul.gate5.blocker.v1","status":"BLOCKED_HUMAN_IDENTITY_SETUP","hosted_acceptance_verified":false,"live_funds_enabled":false}\n' > evidence/production-persona-blocker.json
            echo "Gate 5 blocked: protected persona manifest is absent; no production accounts were modified." >&2
            exit 1
          fi
          python -c 'import json,os; from scripts.go_live.prod_persona_uat import load_manifest; load_manifest(os.environ["LH_PROD_PERSONA_CREDENTIALS_JSON"])'
      - name: Run exact-release hosted persona evidence
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
          OUTPUT_PATH: evidence/production-persona-uat.json
          LH_PROD_PERSONA_CREDENTIALS_JSON: ${{ secrets.LH_PROD_PERSONA_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          python scripts/go_live/prod_persona_uat.py
      - name: Require hardened exact-release acceptance evidence
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python scripts/go_live/validate_persona_acceptance.py --evidence evidence/production-persona-uat.json --release-sha "$EXPECTED_SHA"
      - name: Upload redacted Gate 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-persona-uat-${{ inputs.release_sha }}
          path: |
            evidence/production-persona-uat.json
            evidence/production-persona-blocker.json
          if-no-files-found: error
          retention-days: 90
