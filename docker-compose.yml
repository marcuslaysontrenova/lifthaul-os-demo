# LiftHaul OS — production-parity stack: PostgreSQL 16 + backend.
# Usage:  cp .env.example .env  (fill real secrets)  &&  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifthaul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lifthaul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifthaul} -d ${POSTGRES_DB:-lifthaul}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8787"
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifthaul}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifthaul}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
    ports:
      - "${WEB_PORT:-8787}:8787"
    restart: unless-stopped

volumes:
  pgdata:
